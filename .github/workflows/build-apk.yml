name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html www/index.html

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "راسخ" com.rassikh.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set app icon
        run: |
          sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}
            s=${pair##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon-512x512.png -resize ${s}x${s} $RES/mipmap-$d/$n.png
            done
          done

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: rassikh-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
